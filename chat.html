<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estudio A.X.A. - Atención Virtual</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #121212; color: #ffffff; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .chat-container { width: 100%; max-width: 450px; height: 90vh; background: #1e1e1e; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,0.5); border: 1px solid #333; }
    .chat-header { background: #0d0d0d; padding: 16px; text-align: center; border-bottom: 1px solid #333; }
    .chat-header h2 { font-size: 1.1rem; color: #f5f5f5; }
    .chat-header p { font-size: 0.8rem; color: #aaa; margin-top: 4px; }
    .chat-box { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .message { max-width: 80%; padding: 10px 14px; border-radius: 8px; font-size: 0.9rem; line-height: 1.4; }
    .bot { background: #2a2a2a; color: #e0e0e0; align-self: flex-start; border-left: 3px solid #ffb703; }
    .user { background: #ffb703; color: #000000; align-self: flex-end; font-weight: 500; }
    .chat-input { display: flex; padding: 12px; background: #141414; border-top: 1px solid #333; gap: 8px; }
    .chat-input input { flex: 1; background: #2a2a2a; border: 1px solid #444; color: #fff; padding: 10px 14px; border-radius: 6px; outline: none; }
    .chat-input button { background: #ffb703; border: none; color: #000; padding: 10px 16px; font-weight: bold; border-radius: 6px; cursor: pointer; }
    .chat-input button:hover { background: #e0a200; }
  </style>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">
    <h2>Estudio A.X.A.</h2>
    <p>Atención Virtual & Cotizaciones 24/7</p>
  </div>
  <div class="chat-box" id="chatBox">
    <div class="message bot">¡Hola! bienvenido a Estudio A.X.A. 🏗️<br>¿En qué tipo de proyecto o trámite municipal te podemos asesorar en Caleta Olivia?</div>
  </div>
  <div class="chat-input">
    <input type="text" id="userInput" placeholder="Escribí tu mensaje..." onkeypress="if(event.key==='Enter') sendMessage()">
    <button onclick="sendMessage()">Enviar</button>
  </div>
</div>

<script>
  // CONFIGURACIÓN TUS CLAVES
  const API_KEY = "AQ.Ab8RN6Lv9CeXLQ39nz7TdyVdr2xPwGJTIs_0XC2Efnr_uXbhWA"; 
  const APPS_SCRIPT_URL = "https://script.google.com/u/0/home/projects/1YXbBBwr4QCHLobIAGOYgW3GGuxV8JIs_wjtMc4d17-K4k2WrnMR33xb-/edit";

  const SYSTEM_INSTRUCTION = `Eres el asistente virtual oficial de "Estudio A.X.A.", un estudio técnico y de arquitectura ubicado en Caleta Olivia, Santa Cruz, Argentina. Tu responsable es el M.M.O. Ayrton Xavier Alonso. Pide amablemente los datos del cliente: Tipo de servicio (obra nueva, ampliación, relevamiento, local), metros cuadrados aproximados, ubicación/barrio en Caleta Olivia, y teléfono de contacto. Al reunir estos datos confirma la recepción.`;

  let history = [];

  async function sendMessage() {
    const input = document.getElementById('userInput');
    const message = input.value.trim();
    if (!message) return;

    appendMessage(message, 'user');
    input.value = '';

    history.push({ role: 'user', parts: [{ text: message }] });

    try {
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent?key=${API_KEY}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          system_instruction: { parts: [{ text: SYSTEM_INSTRUCTION }] },
          contents: history
        })
      });

      const data = await response.json();
      const botReply = data.candidates[0].content.parts[0].text;
      
      history.push({ role: 'model', parts: [{ text: botReply }] });
      appendMessage(botReply, 'bot');

      // Intentar enviar copia a Google Sheets
      if (history.length >= 6) {
        sendToSheets(message);
      }

    } catch (err) {
      appendMessage("Hubo un problema de conexión. Por favor intentá de nuevo.", 'bot');
    }
  }

  function appendMessage(text, sender) {
    const chatBox = document.getElementById('chatBox');
    const msgDiv = document.createElement('div');
    msgDiv.classList.add('message', sender);
    msgDiv.innerHTML = text.replace(/\n/g, '<br>');
    chatBox.appendChild(msgDiv);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function sendToSheets(lastText) {
    fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        nombre: "Lead Web",
        telefono: "Ver conversación",
        servicio: "Consulta Web",
        m2: "-",
        barrio: "-"
      })
    });
  }
</script>

</body>
</html>
